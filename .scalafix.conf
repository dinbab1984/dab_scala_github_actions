// Scalafix configuration
rules = [
  OrganizeImports,
  RemoveUnused,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  ProcedureSyntax
]

OrganizeImports {
  groupedImports = Merge
  groups = [
    "re:javax?\\."
    "scala."
    "*"
  ]
  removeUnused = true
}

DisableSyntax {
  noVars = false
  noThrows = false
  noNulls = true
  noReturns = true
  noWhileLoops = false
  noAsInstanceOf = false
  noIsInstanceOf = false
  noXml = false
  noFinalVal = false
  noFinalize = true
  noValPatterns = false
}

